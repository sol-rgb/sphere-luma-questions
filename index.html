<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Talk · Ground Truth</title>
  <meta name="description" content="Conversation cards for Ground Truth, a Sphere conference. Scan, draw a question, talk.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/logo/sphere_logo-night.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="https://groundtruth.getsphere.com" aria-label="Ground Truth, a Sphere conference">
      <img src="assets/logo/sphere_logo-night.svg" width="122" height="46" alt="Sphere">
    </a>
    <p class="series"><span class="dash" aria-hidden="true"></span>A Sphere Event Series</p>
  </header>

  <main class="wrap">
    <div class="page-head">
      <h1 class="page-title">Table Talk</h1>
      <p class="page-sub">Randomized questions to open up the conversation, submitted by tonight's guests with their RSVPs.</p>
    </div>

    <section class="card" id="card" aria-live="polite">
      <div class="card-inner">
        <div class="question-wrap" id="qwrap">
          <p class="question" id="question">Shuffling the deck…</p>
        </div>
      </div>
    </section>

    <button id="draw" class="btn" type="button">Draw another question</button>

    <p class="notice" id="placeholder-notice" hidden>
      Sample deck for setup. The submitted questions land before doors open.
    </p>
  </main>

  <footer class="site-footer">
    <p class="footnote">It shouldn't be your job to break the ice.<sup>*</sup></p>
    <p class="footnote-sub"><sup>*</sup> That's ours.</p>
  </footer>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
